<div class="elementos-container">
    <h1>Elementos de Interfaz</h1>
    <p class="subtitle">Componentes reutilizables con estilos modernos.</p>

    <div class="elements-grid">
        <!-- Card Section -->
        <section class="element-section scale-in">
            <h2>Tarjetas (Cards)</h2>
            <div class="card">
                <div class="card-image"></div>
                <div class="card-content">
                    <h3>Título de la Tarjeta</h3>
                    <p>Descripción breve del contenido de la tarjeta. Ideal para resúmenes.</p>
                    <button class="btn btn-primary">Ver más</button>
                </div>
            </div>
        </section>

        <!-- Buttons Section -->
        <section class="element-section scale-in delay-1">
            <h2>Botones</h2>
            <div class="button-group">
                <button class="btn btn-primary">Primario</button>
                <button class="btn btn-secondary">Secundario</button>
                <button class="btn btn-outline">Outline</button>
            </div>
        </section>

        <!-- Inputs Section -->
        <section class="element-section scale-in delay-2">
            <h2>Inputs</h2>
            <div class="input-group">
                <input type="text" placeholder="Nombre completo" class="input-field">
                <input type="email" placeholder="Correo electrónico" class="input-field">
            </div>
        </section>
    </div>
</div>
