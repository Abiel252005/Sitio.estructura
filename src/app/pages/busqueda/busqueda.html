<div class="search-page-container">
  <div class="search-header center-content">
    <h1 class="page-title text-gradient animate-slide-up">Centro de Búsqueda</h1>
    <p class="subtitle animate-slide-up delay-1">Encuentra todo lo que necesitas en nuestra estructura.</p>
  </div>

  <div class="search-main glass-panel animate-scale-in delay-2">
    <!-- Simple Search -->
    <div class="search-input-wrapper">
      <input class="main-search-input" placeholder="Escribe lo que buscas..." [(ngModel)]="query"
        (keyup.enter)="doSearch()" />
      <button class="search-action-btn" (click)="doSearch()">
        <span class="icon">🔍</span>
      </button>
    </div>

    <div class="search-tags animate-fade-in delay-3">
      <span class="tag" (click)="query='Dashboard'; doSearch()">Dashboard</span>
      <span class="tag" (click)="query='Perfil'; doSearch()">Perfil</span>
      <span class="tag" (click)="query='Ayuda'; doSearch()">Ayuda</span>
    </div>

    <!-- Advanced Search Toggle (Visual only for now) -->
    <div class="advanced-search-toggle">
      <span class="toggle-text">Filtros Avanzados</span>
      <div class="filter-row">
        <select class="custom-select" [(ngModel)]="filters.type" (change)="doSearch()">
          <option value="todos">Todos los Tipos</option>
          <option value="pagina">Páginas</option>
          <option value="seccion">Secciones</option>
        </select>

        <select class="custom-select" [(ngModel)]="filters.section" (change)="doSearch()">
          <option value="todas">Todas las Secciones</option>
          <option *ngFor="let s of sections" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div class="search-results-section animate-slide-up delay-3">
    <h3 class="results-header" *ngIf="(results$ | async) as results">
      Resultados
    </h3>

    <ng-container *ngIf="results$ | async as results">
      <div *ngIf="results.length === 0" class="no-results glass-panel">
        <p>No encontramos nada con esos términos. Intenta otra búsqueda.</p>
      </div>

      <div *ngIf="results.length > 0" class="results-grid">
        <a *ngFor="let item of results" class="result-card glass-panel" [routerLink]="item.path">
          <div class="result-icon">📄</div>
          <div class="result-info">
            <h4 class="result-title">{{ item.title }}</h4>
            <p class="result-desc">{{ item.description }}</p>
            <span class="result-tag">{{ item.section }}</span>
          </div>
          <div class="result-arrow">→</div>
        </a>
      </div>
    </ng-container>
  </div>
</div>
